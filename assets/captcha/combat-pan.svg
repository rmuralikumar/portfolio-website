<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradPan" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#23272e" />
      <stop offset="70%" stop-color="#121417" />
      <stop offset="100%" stop-color="#07080a" />
    </radialGradient>
    <radialGradient id="panMetal" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4a525d" />
      <stop offset="60%" stop-color="#282c33" />
      <stop offset="100%" stop-color="#14161a" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradPan)" />
  <!-- Heavy Cast Iron Frying Pan -->
  <!-- Outer Pan Rim & Thickness -->
  <circle cx="170" cy="200" r="115" fill="#14161a" stroke="#000000" stroke-width="5" />
  <circle cx="170" cy="200" r="105" fill="url(#panMetal)" stroke="#373e48" stroke-width="3" />
  <circle cx="170" cy="200" r="88" fill="#1b1e23" stroke="#252930" stroke-width="2" />
  <!-- Heavy Riveted Pan Handle -->
  <path d="M 260 230 L 355 315 Q 365 325 355 335 Q 345 345 335 335 L 240 250 Z" fill="#14161a" stroke="#000" stroke-width="3" />
  <!-- Handle Hanging Hole -->
  <circle cx="345" cy="325" r="7" fill="#23272e" stroke="#4a525d" stroke-width="2" />
  <!-- Cast Iron Texture Markings -->
  <path d="M 125 170 Q 170 140 215 170" stroke="#373e48" stroke-width="3" fill="none" opacity="0.4" />
  <!-- Distractor Badge Indicator -->
  <rect x="20" y="20" width="135" height="28" rx="6" fill="rgba(148, 163, 184, 0.2)" stroke="#94a3b8" stroke-width="1.5" />
  <text x="87" y="39" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">COMBAT PAN</text>
</svg>