<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradGlacier" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a2a3a" />
      <stop offset="70%" stop-color="#04141e" />
      <stop offset="100%" stop-color="#02080d" />
    </radialGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="40%" stop-color="#4dd0e1" />
      <stop offset="80%" stop-color="#00838f" />
      <stop offset="100%" stop-color="#004d40" />
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradGlacier)" />
  <!-- Ice Shards Background -->
  <polygon points="60,80 110,40 90,110" fill="#00e5ff" opacity="0.1" filter="url(#iceGlow)" />
  <polygon points="320,70 370,120 310,130" fill="#00e5ff" opacity="0.12" filter="url(#iceGlow)" />
  <!-- M416 Assault Rifle Construction -->
  <rect x="35" y="174" width="140" height="15" fill="url(#iceGrad)" stroke="#b2ebf2" stroke-width="1.5" />
  <polygon points="20,172 35,176 35,188 20,192" fill="#00acc1" />
  <!-- Handguard Rail & Ice Shards -->
  <polygon points="90,160 180,160 175,195 95,195" fill="url(#iceGrad)" stroke="#ffffff" stroke-width="1.5" />
  <polygon points="110,150 130,135 150,150" fill="#e0f7fa" opacity="0.8" />
  <!-- Upper & Lower Receiver -->
  <rect x="175" y="152" width="95" height="46" rx="3" fill="#006064" stroke="#4dd0e1" stroke-width="2" />
  <rect x="195" y="140" width="45" height="12" fill="#00838f" stroke="#e0f7fa" stroke-width="1" />
  <!-- Curved Curved STANAG Magazine (Different from MP40 straight box) -->
  <path d="M 195 198 Q 185 255 165 295 L 195 300 Q 215 255 220 198 Z" fill="url(#iceGrad)" stroke="#ffffff" stroke-width="1.8" />
  <!-- M416 Tactical Pistol Grip -->
  <path d="M 245 198 L 270 275 L 245 282 L 225 198 Z" fill="#004d40" stroke="#4dd0e1" stroke-width="1.5" />
  <!-- Crane Telescopic Stock (Assault Rifle Stock) -->
  <polygon points="270,165 370,155 375,225 330,205 270,190" fill="url(#iceGrad)" stroke="#b2ebf2" stroke-width="1.8" />
  <!-- Distractor Badge Indicator -->
  <rect x="20" y="20" width="135" height="28" rx="6" fill="rgba(0, 229, 255, 0.2)" stroke="#00e5ff" stroke-width="1.5" />
  <text x="87" y="39" fill="#00e5ff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">M416 GLACIER</text>
</svg>