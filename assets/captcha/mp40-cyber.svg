<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradCyber" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a1026" />
      <stop offset="60%" stop-color="#050714" />
      <stop offset="100%" stop-color="#020308" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff00ff" />
    </linearGradient>
    <filter id="glowCyber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with Cyber Grid -->
  <rect width="400" height="400" fill="url(#bgGradCyber)" />
  <g opacity="0.12" stroke="#00f0ff" stroke-width="1">
    <path d="M 0,60 L 400,60 M 0,120 L 400,120 M 0,180 L 400,180 M 0,240 L 400,240 M 0,300 L 400,300 M 0,360 L 400,360" />
    <path d="M 60,0 L 60,400 M 120,0 L 120,400 M 180,0 L 180,400 M 240,0 L 240,400 M 300,0 L 300,400 M 360,0 L 360,400" />
  </g>

  <!-- Neon Backlight Flares -->
  <circle cx="200" cy="190" r="110" fill="#00f0ff" opacity="0.1" filter="url(#glowCyber)" />
  <circle cx="280" cy="180" r="80" fill="#ff007f" opacity="0.12" filter="url(#glowCyber)" />

  <!-- MP40 Cyber Weapon Construction -->
  <!-- Long Barrel -->
  <rect x="40" y="176" width="160" height="18" rx="2" fill="#101424" stroke="#00f0ff" stroke-width="2.5" />
  <rect x="25" y="180" width="18" height="10" rx="2" fill="#00f0ff" filter="url(#glowCyber)" />
  
  <!-- Cyber Circuit Traces on Barrel -->
  <path d="M 50 185 L 110 185 L 125 178 L 195 178" stroke="#ff007f" stroke-width="2" fill="none" filter="url(#glowCyber)" />
  <circle cx="110" cy="185" r="2.5" fill="#00f0ff" />
  <circle cx="125" cy="178" r="2.5" fill="#00f0ff" />

  <!-- Cyber Receiver Box -->
  <rect x="190" y="160" width="105" height="48" rx="4" fill="#15192e" stroke="#ff007f" stroke-width="2.5" />
  
  <!-- Holographic Audio/Power Wave Bars -->
  <line x1="205" y1="192" x2="205" y2="175" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <line x1="215" y1="192" x2="215" y2="168" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <line x1="225" y1="192" x2="225" y2="180" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <line x1="235" y1="192" x2="235" y2="170" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <line x1="245" y1="192" x2="245" y2="177" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <line x1="255" y1="192" x2="255" y2="165" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
  <line x1="265" y1="192" x2="265" y2="172" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
  <line x1="275" y1="192" x2="275" y2="182" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />

  <!-- Straight Box Magazine -->
  <polygon points="196,204 220,204 230,300 206,300" fill="#0d1120" stroke="#00f0ff" stroke-width="2.5" />
  <line x1="212" y1="215" x2="222" y2="290" stroke="#ff007f" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Cyber Grip -->
  <polygon points="255,208 288,285 264,293 234,212" fill="#181328" stroke="#ff007f" stroke-width="2" />
  <circle cx="260" cy="245" r="4" fill="#00f0ff" filter="url(#glowCyber)" />

  <!-- Cyber Neon Skeletal Stock -->
  <path d="M 295 185 L 360 185 Q 375 185 375 198 L 372 230 L 350 230" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glowCyber)" />
  <line x1="295" y1="200" x2="350" y2="230" stroke="#ff007f" stroke-width="2" stroke-linecap="round" />

  <!-- Target Badge Indicator -->
  <rect x="20" y="20" width="125" height="28" rx="6" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="1.5" />
  <text x="82" y="39" fill="#00f0ff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">MP40 NEON</text>
</svg>
