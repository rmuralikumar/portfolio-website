<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradClassic" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e2229" />
      <stop offset="70%" stop-color="#101217" />
      <stop offset="100%" stop-color="#08090b" />
    </radialGradient>
    <linearGradient id="steelMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#707684" />
      <stop offset="35%" stop-color="#464b55" />
      <stop offset="70%" stop-color="#2c3038" />
      <stop offset="100%" stop-color="#1b1e24" />
    </linearGradient>
    <linearGradient id="bakeliteWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#270e02" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradClassic)" />
  <!-- Military HUD Lines -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <circle cx="200" cy="200" r="140" fill="none" stroke-dasharray="8,6" />
    <line x1="200" y1="20" x2="200" y2="380" stroke-dasharray="4,4" />
    <line x1="20" y1="200" x2="380" y2="200" stroke-dasharray="4,4" />
  </g>
  <!-- MP40 Barrel and Front Sight -->
  <polygon points="35,170 42,156 46,170" fill="#2c3038" stroke="#111" stroke-width="1" />
  <rect x="30" y="170" width="18" height="18" rx="2" fill="url(#steelMetal)" stroke="#111" />
  <rect x="48" y="174" width="150" height="12" fill="url(#steelMetal)" stroke="#111" stroke-width="1.5" />
  <rect x="75" y="186" width="90" height="6" fill="url(#bakeliteWood)" rx="1" stroke="#111" stroke-width="1" />
  <!-- Receiver & Cocking Handle -->
  <rect x="180" y="162" width="115" height="32" rx="3" fill="url(#steelMetal)" stroke="#111" stroke-width="2" />
  <rect x="195" y="156" width="12" height="8" rx="1" fill="#cbd5e1" stroke="#111" />
  <rect x="190" y="190" width="105" height="18" rx="2" fill="url(#bakeliteWood)" stroke="#111" stroke-width="1.5" />
  <!-- Long 32-round Steel Magazine -->
  <polygon points="190,205 212,205 220,305 198,305" fill="url(#steelMetal)" stroke="#111" stroke-width="2" />
  <line x1="204" y1="215" x2="212" y2="295" stroke="#111" stroke-width="1.5" />
  <!-- Pistol Grip -->
  <polygon points="256,206 288,284 262,292 234,208" fill="url(#bakeliteWood)" stroke="#111" stroke-width="2" />
  <line x1="262" y1="220" x2="274" y2="275" stroke="#111" stroke-width="2" />
  <!-- Folding Steel Wire Stock -->
  <path d="M 292 186 L 365 186 Q 380 186 380 198 L 376 235 L 355 235" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="295" cy="186" r="4" fill="#cbd5e1" stroke="#111" />
  <!-- Target Badge Indicator -->
  <rect x="20" y="20" width="135" height="28" rx="6" fill="rgba(148, 163, 184, 0.15)" stroke="#94a3b8" stroke-width="1.5" />
  <text x="87" y="39" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">MP40 CLASSIC</text>
</svg>