<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradAkm" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#301309" />
      <stop offset="70%" stop-color="#170803" />
      <stop offset="100%" stop-color="#080200" />
    </radialGradient>
    <linearGradient id="lavaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradAkm)" />
  <!-- Volcanic Ember Sparkles -->
  <circle cx="100" cy="120" r="3" fill="#fb923c" opacity="0.6" />
  <circle cx="310" cy="110" r="2.5" fill="#f97316" opacity="0.7" />
  <circle cx="280" cy="270" r="3" fill="#ea580c" opacity="0.5" />
  <!-- AKM Barrel and Slanted Muzzle Brake -->
  <polygon points="25,178 35,174 35,190 25,188" fill="#1c1917" stroke="#ea580c" stroke-width="1.5" />
  <rect x="35" y="178" width="135" height="10" fill="#292524" stroke="#111" stroke-width="1" />
  <polygon points="48,172 54,160 58,172" fill="#292524" />
  <!-- Gas Tube and Burnt Wooden Handguard -->
  <rect x="80" y="165" width="85" height="32" rx="3" fill="url(#lavaGrad)" stroke="#ea580c" stroke-width="1.5" />
  <line x1="88" y1="181" x2="158" y2="181" stroke="#f97316" stroke-width="2" />
  <!-- AKM Stamped Steel Receiver -->
  <rect x="165" y="162" width="95" height="38" rx="2" fill="#1c1917" stroke="#f97316" stroke-width="2" />
  <!-- Distinctive Curved Banana Magazine -->
  <path d="M 180 196 Q 165 260 135 298 L 165 305 Q 200 260 210 196 Z" fill="url(#lavaGrad)" stroke="#f97316" stroke-width="2" />
  <!-- Wooden Pistol Grip -->
  <polygon points="238,198 265,275 240,282 220,198" fill="url(#lavaGrad)" stroke="#7c2d12" stroke-width="1.5" />
  <!-- Classic Solid Wooden AKM Stock -->
  <polygon points="260,172 375,178 375,230 310,218 260,192" fill="url(#lavaGrad)" stroke="#ea580c" stroke-width="2" />
  <!-- Distractor Badge Indicator -->
  <rect x="20" y="20" width="135" height="28" rx="6" fill="rgba(234, 88, 12, 0.2)" stroke="#ea580c" stroke-width="1.5" />
  <text x="87" y="39" fill="#fdba74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">AKM HELLFIRE</text>
</svg>