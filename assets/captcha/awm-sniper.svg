<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradAwm" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#182414" />
      <stop offset="70%" stop-color="#0c140a" />
      <stop offset="100%" stop-color="#040803" />
    </radialGradient>
    <linearGradient id="awmGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#657e3f" />
      <stop offset="50%" stop-color="#475b28" />
      <stop offset="100%" stop-color="#2a3816" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradAwm)" />
  <!-- Sniper Crosshair Pattern -->
  <g opacity="0.15" stroke="#84cc16" stroke-width="1.2">
    <circle cx="200" cy="200" r="120" fill="none" />
    <circle cx="200" cy="200" r="60" fill="none" />
    <line x1="200" y1="50" x2="200" y2="350" />
    <line x1="50" y1="200" x2="350" y2="200" />
  </g>
  <!-- Long Heavy Fluted Sniper Barrel -->
  <rect x="20" y="180" width="190" height="12" fill="#1e241c" stroke="#111" stroke-width="1" />
  <rect x="10" y="176" width="15" height="20" fill="#2d3728" stroke="#111" />
  <!-- Massive 8X Sniper Scope Mounted on Top -->
  <polygon points="135,148 165,153 235,153 265,145 265,167 235,162 165,162 135,166" fill="#1c211a" stroke="#475b28" stroke-width="1.8" />
  <rect x="180" y="162" width="10" height="18" fill="#111" />
  <rect x="220" y="162" width="10" height="18" fill="#111" />
  <!-- Magnum Receiver & Body -->
  <polygon points="175,178 300,178 305,215 175,200" fill="url(#awmGreen)" stroke="#1c2512" stroke-width="2" />
  <!-- Short Magnum Box Magazine -->
  <rect x="198" y="200" width="45" height="35" rx="3" fill="#1c221a" stroke="#111" stroke-width="1.5" />
  <!-- AWM Thumbhole Sniper Stock -->
  <path d="M 300 178 L 385 185 L 385 245 L 340 240 L 315 215 L 270 215 Z" fill="url(#awmGreen)" stroke="#1c2512" stroke-width="2" />
  <ellipse cx="320" cy="210" rx="14" ry="10" fill="#0c140a" stroke="#1c2512" stroke-width="1.5" />
  <!-- Distractor Badge Indicator -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="rgba(132, 204, 22, 0.2)" stroke="#84cc16" stroke-width="1.5" />
  <text x="85" y="39" fill="#bef264" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">AWM SNIPER</text>
</svg>