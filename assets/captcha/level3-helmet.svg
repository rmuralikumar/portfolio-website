<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradHelmet" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#222b22" />
      <stop offset="70%" stop-color="#111711" />
      <stop offset="100%" stop-color="#060906" />
    </radialGradient>
    <linearGradient id="titaniumMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556455" />
      <stop offset="50%" stop-color="#343d34" />
      <stop offset="100%" stop-color="#1b211b" />
    </linearGradient>
    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradHelmet)" />
  <!-- Helmet Dome Shell -->
  <path d="M 80 230 Q 85 90 200 85 Q 315 90 320 230 Q 295 295 200 300 Q 105 295 80 230 Z" fill="url(#titaniumMetal)" stroke="#111611" stroke-width="4" />
  <!-- Spetsnaz Steel Face Shield Visor Frame -->
  <path d="M 95 195 Q 200 180 305 195 L 295 255 Q 200 270 105 255 Z" fill="#1e261e" stroke="#0d110d" stroke-width="3" />
  <!-- Ballistic Slit Glass -->
  <rect x="135" y="212" width="130" height="22" rx="4" fill="url(#visorGlass)" stroke="#64748b" stroke-width="2" />
  <line x1="145" y1="223" x2="255" y2="223" stroke="#e0f2fe" stroke-width="2" opacity="0.6" />
  <!-- Heavy Visor Hinges & Rivets -->
  <circle cx="105" cy="205" r="7" fill="#64748b" stroke="#111" stroke-width="1.5" />
  <circle cx="295" cy="205" r="7" fill="#64748b" stroke="#111" stroke-width="1.5" />
  <!-- Heavy Chin Strap -->
  <path d="M 110 260 Q 150 340 200 342 Q 250 340 290 260" stroke="#2e382e" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- Distractor Badge Indicator -->
  <rect x="20" y="20" width="135" height="28" rx="6" fill="rgba(74, 222, 128, 0.15)" stroke="#4ade80" stroke-width="1.5" />
  <text x="87" y="39" fill="#86efac" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">LVL 3 HELMET</text>
</svg>